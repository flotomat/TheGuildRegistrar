# Automatic versioning: every push to main runs the checks, then derives the next
# version from the commit messages since the last tag (see .github/scripts/release.py),
# creates the tag and starts the release workflow for it.
#   feat!: / BREAKING CHANGE  -> A+1.0.0
#   feat:                     -> A.B+1.0
#   fix:, docs:, ui:, ...     -> A.B.C+1
#   ci:, build:, chore:, test: alone -> no release
name: Version

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  actions: write

# One run at a time, so two quick pushes never get the same version.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: next
        run: python3 .github/scripts/release.py next

      - name: Create tag and start release
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          # Tags pushed with the workflow token do not trigger workflows, so start the release explicitly.
          gh workflow run release.yml --ref "$TAG"
          echo "### Release $TAG started" >> "$GITHUB_STEP_SUMMARY"
