# Release for a tag vA.B.C -> addon zip to CurseForge + GitHub release, Peasant (helper app) builds attached.
# Normally started by version.yml after it created the tag; pushing a tag by hand still works.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  addon:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from commit messages
        run: python3 .github/scripts/release.py notes "$GITHUB_REF_NAME" RELEASE_NOTES.md

      - name: Package addon and upload (CurseForge + GitHub release)
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

  peasant:
    needs: addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        working-directory: peasant
        run: go test ./...

      - name: Build
        working-directory: peasant
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p ../dist
          build() {
            local os=$1 arch=$2 label=$3 ext=$4
            local dir="TheGuildRegistrar-Peasant-${label}"
            mkdir -p "$dir"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$dir/TheGuildRegistrar-Peasant${ext}" .
            cp ../LICENSE "$dir/"
            cp ../docs/peasant-readme.txt "$dir/README.txt"
            if [ "$os" = "linux" ]; then
              tar -czf "../dist/${dir}.tar.gz" "$dir"
            else
              zip -qr "../dist/${dir}.zip" "$dir"
            fi
            rm -rf "$dir"
          }
          build windows amd64 windows-x64 .exe
          build darwin arm64 macos-apple-silicon ""
          build darwin amd64 macos-intel ""
          build linux amd64 linux-x64 ""
          ls -la ../dist

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
