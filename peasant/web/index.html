<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peasant - The Guild Registrar</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #ffffff; --text: #1f1d1a; --muted: #6b665d; --line: #e2ddd2;
    --accent: #7a4fd6; --accent-text: #ffffff; --ok: #2f8a4a; --warn: #b26b00; --err: #c0392b; --code: #f0ece3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16151a; --card: #201f26; --text: #ece9f2; --muted: #a29fae; --line: #34323d;
      --accent: #9b78ef; --accent-text: #111; --ok: #5cc27a; --warn: #f0a93b; --err: #ef6b5b; --code: #2b2933; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .num.done { background: var(--ok); }
  ol, ul { padding-left: 20px; margin: 8px 0; }
  li { margin: 3px 0; }
  code { background: var(--code); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type=password], input[type=text], select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row > input, .row > select { flex: 1; min-width: 220px; }
  .status { padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
  .status.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .status.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .status.err { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .hidden { display: none !important; }
  .big { font-size: 16px; padding: 10px 22px; }
  footer { margin-top: 28px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lang button { padding: 4px 10px; font-size: 13px; }
  .lang button.active { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Peasant</h1>
      <div class="muted small" data-t="subtitle"></div>
    </div>
    <div class="lang"><button data-lang="de">DE</button> <button data-lang="en">EN</button></div>
  </header>

  <div id="loading" class="card muted" data-t="loading"></div>

  <!-- Setup wizard -->
  <section id="setup" class="hidden">
    <div class="card">
      <h2 data-t="welcomeTitle"></h2>
      <p data-t="welcomeText"></p>
    </div>

    <div class="card step">
      <div class="num" id="n1">1</div>
      <div>
        <h2 data-t="s1Title"></h2>
        <ol>
          <li data-t="s1a"></li>
          <li data-t="s1b"></li>
          <li data-t="s1c"></li>
          <li data-t="s1d"></li>
        </ol>
        <a class="btn" id="portalLink" target="_blank" rel="noopener" href="https://discord.com/developers/applications" data-t="openPortal"></a>
      </div>
    </div>

    <div class="card step">
      <div class="num" id="n2">2</div>
      <div>
        <h2 data-t="s2Title"></h2>
        <p data-t="s2Text"></p>
        <div class="row">
          <input type="password" id="tokenInput" autocomplete="off" spellcheck="false">
          <button class="primary" id="saveToken" data-t="saveToken"></button>
        </div>
        <div id="tokenStatus" class="status hidden"></div>
        <p class="muted small" id="storageInfo"></p>
      </div>
    </div>
  </section>

  <!-- Configured -->
  <section id="ready" class="hidden">
    <div class="card step">
      <div class="num done">&#10003;</div>
      <div>
        <h2 data-t="botTitle"></h2>
        <div id="botInfo"></div>
        <div id="intentStatus" class="status hidden"></div>
      </div>
    </div>

    <div class="card step" id="inviteCard">
      <div class="num" id="n3">3</div>
      <div>
        <h2 data-t="s3Title"></h2>
        <p data-t="s3Text"></p>
        <div class="row">
          <a class="btn primary" id="inviteLink" target="_blank" rel="noopener" data-t="invite"></a>
          <button id="reloadGuilds" data-t="reloadGuilds"></button>
        </div>
        <div id="guildStatus" class="status hidden"></div>
      </div>
    </div>

    <div class="card step" id="exportCard">
      <div class="num" id="n4">4</div>
      <div>
        <h2 data-t="s4Title"></h2>
        <div class="row">
          <select id="guildSelect"></select>
        </div>
        <div class="row">
          <label><input type="checkbox" id="includeBots"> <span data-t="includeBots"></span></label>
        </div>
        <div class="row">
          <button class="primary big" id="exportBtn" data-t="export"></button>
        </div>
        <div id="exportStatus" class="status hidden"></div>
        <div id="exportResult" class="hidden">
          <p class="small muted" data-t="manualCopy"></p>
          <textarea id="exportText" readonly autocomplete="off" spellcheck="false"></textarea>
          <div class="row"><button id="copyAgain" data-t="copyAgain"></button></div>
          <p class="small muted" data-t="notStored"></p>
        </div>
      </div>
    </div>

    <div class="card step">
      <div class="num">5</div>
      <div>
        <h2 data-t="s5Title"></h2>
        <p data-t="s5Text"></p>
      </div>
    </div>
  </section>

  <div class="card">
    <h2 data-t="privacyTitle"></h2>
    <p data-t="privacyText"></p>
    <p data-t="privacyDuty"></p>
    <a class="btn" target="_blank" rel="noopener" href="https://github.com/Flotomat/TheGuildRegistrar/blob/main/docs/privacy.md" data-t="privacyLink"></a>
    <p class="small muted" data-t="legal"></p>
  </div>

  <footer>
    <div class="muted small">Peasant {{VERSION}} &middot; The Guild Registrar &middot; GPL-3.0 &middot; <span data-t="privacy"></span></div>
    <div class="row" style="margin:0">
      <button id="removeToken" class="hidden" data-t="removeToken"></button>
      <button id="quitBtn" data-t="quit"></button>
    </div>
  </footer>
</main>

<script>
const KEY = "{{KEY}}";
const T = {
  en: {
    subtitle: "Helper app of the WoW addon The Guild Registrar: exports your Discord member list",
    loading: "Loading...",
    welcomeTitle: "Welcome!",
    welcomeText: "This app reads the display names and role names of your Discord server members with your own bot and puts them into your clipboard for the addon. Nothing is sent anywhere else. Setup is needed only once.",
    s1Title: "Create a Discord bot",
    s1a: "Open the Discord Developer Portal and log in. Click \"New Application\", give it a name (e.g. \"Guild Registrar\") and confirm.",
    s1b: "Open \"Bot\" on the left. Scroll to \"Privileged Gateway Intents\" and turn ON \"Server Members Intent\". Save the changes.",
    s1c: "On the same page click \"Reset Token\" and copy the token. Treat it like a password and never share it.",
    s1d: "Optional: turn off \"Public Bot\" so only you can invite it.",
    openPortal: "Open Developer Portal",
    s2Title: "Paste the bot token",
    s2Text: "The token is checked with Discord and stored protected on this PC (see below).",
    saveToken: "Check & save",
    botTitle: "Bot connected",
    s3Title: "Invite the bot to your server",
    s3Text: "Open the invite link, choose your server and confirm. You need the \"Manage Server\" permission on that server (or ask someone who has it to open the link). The bot gets no permissions.",
    invite: "Open invite link",
    reloadGuilds: "I invited it - reload servers",
    s4Title: "Export the member list",
    includeBots: "Include bot accounts",
    export: "Export to clipboard",
    s5Title: "Paste it in the game",
    s5Text: "In WoW type /tgr, open the \"Import\" tab, click into the text field, press Ctrl+V and click \"Import\". Repeat steps 4 and 5 whenever you want to update the list.",
    manualCopy: "If pasting does not work, copy the text from this field:",
    copyAgain: "Copy again",
    removeToken: "Remove token",
    quit: "Quit",
    privacy: "Exports display names and role names only - no IDs.",
    notStored: "The export is not saved on disk. It is only kept on this page and is gone when you close Peasant.",
    privacyTitle: "Privacy",
    privacyText: "Discord sends the bot the full member data (e.g. user ID, user name, avatar, join date). Peasant processes it only in memory and keeps only the display name (server nickname, otherwise global display name, otherwise Discord user name) and the role names. It talks only to discord.com, stores only the bot token (Windows: encrypted with DPAPI, macOS: keychain, Linux: file readable only by you) and your settings (server ID, bot option), and has no telemetry. The export is not saved to a file. Note: Windows clipboard history or cloud clipboard sync may capture the copied list.",
    privacyDuty: "You decide what happens with the data of your members, so you are responsible for it (e.g. under the GDPR). Please tell your members that their Discord names and roles are compared with the guild roster, and follow the Discord Developer Terms and Developer Policy.",
    privacyLink: "Full privacy notice",
    legal: "The Guild Registrar is an independent fan project and is not affiliated with or endorsed by Blizzard Entertainment or Discord Inc. World of Warcraft is a trademark of Blizzard Entertainment, Inc.; Discord is a trademark of Discord Inc. Provided without warranty (GPL-3.0, sections 15-16). This is not legal advice.",
    storage: "Token storage: ",
    checking: "Checking...",
    tokenOk: "Token saved.",
    invalid_token: "Discord does not accept this token. Reset it in the Developer Portal (Bot page) and paste the new one.",
    tokenSavedBad: "The saved token is no longer valid. Please paste a new one.",
    intentOk: "Server Members Intent is enabled.",
    intentMissing: "Server Members Intent is OFF - turn it on under \"Bot\" > \"Privileged Gateway Intents\" in the Developer Portal, save, then reload this page.",
    openBotPage: "Open bot page",
    noGuilds: "The bot is not on any server yet. Invite it first.",
    guildsFound: "The bot is on {n} server(s).",
    exporting: "Exporting...",
    exported: "Exported {m} members and {r} roles of \"{s}\" - copied to clipboard. Now paste it in the game.",
    exportedNoClip: "Exported {m} members and {r} roles of \"{s}\". Copy the text below.",
    missing_intent: "The bot may not read the member list. Turn on \"Server Members Intent\" in the Developer Portal (Bot page) and try again.",
    guild_not_found: "Server not found - is the bot still on this server?",
    error: "Error: ",
    confirmRemove: "Remove the saved token from this PC?",
    bye: "Peasant has stopped. You can close this tab.",
    botName: "Bot: ",
  },
  de: {
    subtitle: "Hilfsprogramm des WoW-Addons The Guild Registrar: exportiert eure Discord-Mitgliederliste",
    loading: "Lade...",
    welcomeTitle: "Willkommen!",
    welcomeText: "Dieses Programm liest mit deinem eigenen Bot die Anzeigenamen und Rollennamen der Mitglieder deines Discord-Servers und legt sie für das Addon in die Zwischenablage. Es wird nichts an Dritte gesendet. Die Einrichtung ist nur einmal nötig.",
    s1Title: "Discord-Bot anlegen",
    s1a: "Öffne das Discord Developer Portal und melde dich an. Klicke auf \"New Application\", gib einen Namen ein (z. B. \"Guild Registrar\") und bestätige.",
    s1b: "Links auf \"Bot\" klicken. Unter \"Privileged Gateway Intents\" den Schalter \"Server Members Intent\" EINschalten und speichern.",
    s1c: "Auf derselben Seite \"Reset Token\" klicken und das Token kopieren. Behandle es wie ein Passwort und gib es nie weiter.",
    s1d: "Optional: \"Public Bot\" ausschalten, damit nur du ihn einladen kannst.",
    openPortal: "Developer Portal öffnen",
    s2Title: "Bot-Token einfügen",
    s2Text: "Das Token wird bei Discord geprüft und geschützt auf diesem PC gespeichert (siehe unten).",
    saveToken: "Prüfen & speichern",
    botTitle: "Bot verbunden",
    s3Title: "Bot auf deinen Server einladen",
    s3Text: "Öffne den Einladungslink, wähle deinen Server und bestätige. Dafür brauchst du auf dem Server das Recht \"Server verwalten\" (oder bitte jemanden, der es hat, den Link zu öffnen). Der Bot bekommt keine Rechte.",
    invite: "Einladungslink öffnen",
    reloadGuilds: "Eingeladen - Server neu laden",
    s4Title: "Mitgliederliste exportieren",
    includeBots: "Bot-Konten mit exportieren",
    export: "In die Zwischenablage exportieren",
    s5Title: "Im Spiel einfügen",
    s5Text: "In WoW /tgr eingeben, den Tab \"Import\" öffnen, ins Textfeld klicken, Strg+V drücken und auf \"Importieren\" klicken. Schritte 4 und 5 wiederholst du, wann immer du die Liste aktualisieren willst.",
    manualCopy: "Falls das Einfügen nicht klappt, kopiere den Text aus diesem Feld:",
    copyAgain: "Erneut kopieren",
    removeToken: "Token entfernen",
    quit: "Beenden",
    privacy: "Exportiert nur Anzeigenamen und Rollennamen - keine IDs.",
    notStored: "Der Export wird nicht auf der Festplatte gespeichert. Er bleibt nur auf dieser Seite und ist nach dem Beenden des Programms weg.",
    privacyTitle: "Datenschutz",
    privacyText: "Discord liefert dem Bot vollständige Mitgliedsdaten (z. B. Benutzer-ID, Benutzername, Avatar, Beitrittsdatum). Das Programm verarbeitet sie nur im Arbeitsspeicher und übernimmt nur den Anzeigenamen (Server-Spitzname, sonst globaler Anzeigename, sonst Discord-Benutzername) und die Rollennamen. Es spricht nur mit discord.com, speichert nur das Bot-Token (Windows: mit DPAPI verschlüsselt, macOS: Schlüsselbund, Linux: nur für dich lesbare Datei) und deine Einstellungen (Server-ID, Bot-Option) und hat keine Telemetrie. Der Export wird nicht in einer Datei gespeichert. Hinweis: Der Windows-Zwischenablageverlauf oder eine Cloud-Synchronisierung der Zwischenablage können die kopierte Liste erfassen.",
    privacyDuty: "Du entscheidest, was mit den Daten deiner Mitglieder geschieht, und bist dafür verantwortlich (z. B. nach der DSGVO). Bitte informiere deine Mitglieder, dass ihre Discord-Namen und Rollen mit der Gildenliste abgeglichen werden, und beachte die Discord Developer Terms und Developer Policy.",
    privacyLink: "Vollständiger Datenschutzhinweis",
    legal: "The Guild Registrar ist ein unabhängiges Fan-Projekt und steht in keiner Verbindung zu Blizzard Entertainment oder Discord Inc. und wird von diesen nicht unterstützt. World of Warcraft ist eine Marke von Blizzard Entertainment, Inc.; Discord ist eine Marke von Discord Inc. Bereitstellung ohne Gewährleistung (GPL-3.0, Abschnitte 15-16). Keine Rechtsberatung.",
    storage: "Token-Speicherung: ",
    checking: "Prüfe...",
    tokenOk: "Token gespeichert.",
    invalid_token: "Discord akzeptiert dieses Token nicht. Setze es im Developer Portal (Seite \"Bot\") zurück und füge das neue ein.",
    tokenSavedBad: "Das gespeicherte Token ist nicht mehr gültig. Bitte ein neues einfügen.",
    intentOk: "Server Members Intent ist aktiviert.",
    intentMissing: "Server Members Intent ist AUS - im Developer Portal unter \"Bot\" > \"Privileged Gateway Intents\" einschalten, speichern und diese Seite neu laden.",
    openBotPage: "Bot-Seite öffnen",
    noGuilds: "Der Bot ist noch auf keinem Server. Lade ihn zuerst ein.",
    guildsFound: "Der Bot ist auf {n} Server(n).",
    exporting: "Exportiere...",
    exported: "{m} Mitglieder und {r} Rollen von \"{s}\" exportiert und in die Zwischenablage kopiert. Jetzt im Spiel einfügen.",
    exportedNoClip: "{m} Mitglieder und {r} Rollen von \"{s}\" exportiert. Kopiere den Text unten.",
    missing_intent: "Der Bot darf die Mitgliederliste nicht lesen. Schalte im Developer Portal (Seite \"Bot\") \"Server Members Intent\" ein und versuche es erneut.",
    guild_not_found: "Server nicht gefunden - ist der Bot noch auf diesem Server?",
    error: "Fehler: ",
    confirmRemove: "Gespeichertes Token von diesem PC entfernen?",
    bye: "Das Programm wurde beendet. Du kannst diesen Tab schließen.",
    botName: "Bot: ",
  },
};

let lang = localStorage.getItem("tgr-lang") || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");
let state = null;
const $ = (id) => document.getElementById(id);
const t = (k, vars) => {
  let s = (T[lang] && T[lang][k]) || T.en[k] || k;
  for (const [a, b] of Object.entries(vars || {})) s = s.replaceAll("{" + a + "}", b);
  return s;
};

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
  if (state) render();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; localStorage.setItem("tgr-lang", lang); applyLang();
}));

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-TGR-Key": KEY, "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.message || res.statusText); e.code = data.error; throw e; }
  return data;
}

function show(el, kind, text) {
  el.className = "status " + kind;
  el.textContent = text;
}
function errText(e) { return T.en[e.code] ? t(e.code) : t("error") + e.message; }

async function load() {
  $("loading").classList.remove("hidden");
  try { state = await api("/api/state"); } catch (e) { $("loading").textContent = t("error") + e.message; return; }
  $("loading").classList.add("hidden");
  render();
}

function render() {
  const configured = state.hasToken && !state.tokenError;
  $("setup").classList.toggle("hidden", configured);
  $("ready").classList.toggle("hidden", !configured);
  $("removeToken").classList.toggle("hidden", !state.hasToken);
  $("storageInfo").textContent = t("storage") + state.tokenStorage;
  if (state.tokenError) show($("tokenStatus"), "err", t("tokenSavedBad"));
  if (!configured) return;

  $("botInfo").textContent = t("botName") + state.botName;
  const intent = $("intentStatus");
  if (state.membersIntent) { show(intent, "ok", t("intentOk")); }
  else {
    show(intent, "warn", t("intentMissing") + " ");
    const a = document.createElement("a"); a.href = state.portalUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("openBotPage");
    intent.appendChild(a);
  }
  $("inviteLink").href = state.inviteUrl || "#";
  const gs = $("guildStatus");
  if (state.guilds.length === 0) show(gs, "warn", t("noGuilds")); else show(gs, "ok", t("guildsFound", { n: state.guilds.length }));
  $("n3").classList.toggle("done", state.guilds.length > 0);

  const sel = $("guildSelect");
  sel.innerHTML = "";
  for (const g of state.guilds) {
    const o = document.createElement("option"); o.value = g.id; o.textContent = g.name;
    if (g.id === state.guildId) o.selected = true;
    sel.appendChild(o);
  }
  $("exportCard").classList.toggle("hidden", state.guilds.length === 0);
  $("includeBots").checked = !!state.includeBots;
}

$("saveToken").addEventListener("click", async () => {
  const st = $("tokenStatus");
  show(st, "warn", t("checking"));
  try {
    await api("/api/token", { method: "POST", body: JSON.stringify({ token: $("tokenInput").value }) });
    $("tokenInput").value = "";
    show(st, "ok", t("tokenOk"));
    await load();
  } catch (e) { show(st, "err", errText(e)); }
});

$("reloadGuilds").addEventListener("click", load);

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = $("exportText"); ta.focus(); ta.select();
    try { return document.execCommand("copy"); } catch (_) { return false; }
  }
}

$("exportBtn").addEventListener("click", async () => {
  const st = $("exportStatus");
  const btn = $("exportBtn");
  btn.disabled = true;
  show(st, "warn", t("exporting"));
  try {
    const res = await api("/api/export", { method: "POST", body: JSON.stringify({ guildId: $("guildSelect").value, includeBots: $("includeBots").checked }) });
    $("exportText").value = res.text;
    $("exportResult").classList.remove("hidden");
    const ok = await copy(res.text);
    const vars = { m: res.members, r: res.roles, s: res.server };
    show(st, ok ? "ok" : "warn", t(ok ? "exported" : "exportedNoClip", vars));
    st.style.whiteSpace = "pre-line";
    $("n4").classList.add("done");
  } catch (e) { show(st, "err", errText(e)); }
  btn.disabled = false;
});

$("copyAgain").addEventListener("click", () => copy($("exportText").value));

$("removeToken").addEventListener("click", async () => {
  if (!confirm(t("confirmRemove"))) return;
  await api("/api/token", { method: "DELETE" });
  await load();
});

$("quitBtn").addEventListener("click", async () => {
  try { await api("/api/quit", { method: "POST" }); } catch (_) {}
  document.querySelector("main").innerHTML = "<div class='card'>" + t("bye") + "</div>";
});

setInterval(() => { api("/api/ping").catch(() => {}); }, 60000);
applyLang();
load();
</script>
</body>
</html>
