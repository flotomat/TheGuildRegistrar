<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peasant - The Guild Registrar</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #ffffff; --text: #1f1d1a; --muted: #6b665d; --line: #e2ddd2;
    --accent: #7a4fd6; --accent-text: #ffffff; --ok: #2f8a4a; --warn: #b26b00; --err: #c0392b; --code: #f0ece3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16151a; --card: #201f26; --text: #ece9f2; --muted: #a29fae; --line: #34323d;
      --accent: #9b78ef; --accent-text: #111; --ok: #5cc27a; --warn: #f0a93b; --err: #ef6b5b; --code: #2b2933; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .num.done { background: var(--ok); }
  ol, ul { padding-left: 20px; margin: 8px 0; }
  li { margin: 3px 0; }
  code { background: var(--code); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  input[type=password], input[type=text], select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row > input, .row > select { flex: 1; min-width: 220px; }
  .status { padding: 10px 12px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
  .status.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .status.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .status.err { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, Consolas, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .hidden { display: none !important; }
  .big { font-size: 16px; padding: 10px 22px; }
  footer { margin-top: 28px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .lang button { padding: 4px 10px; font-size: 13px; }
  .lang button.active { border-color: var(--accent); color: var(--accent); }
  .mode { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .meter > div { height: 100%; width: 0; transition: width .2s, background .2s; }
  .meter .weak { width: 33%; background: var(--err); }
  .meter .medium { width: 66%; background: var(--warn); }
  .meter .strong { width: 100%; background: var(--ok); }
  .lvl-weak { color: var(--err); } .lvl-medium { color: var(--warn); } .lvl-strong { color: var(--ok); }
  .secret { font: 14px ui-monospace, Consolas, monospace; word-break: break-all; }
  label.field { display: block; margin-top: 10px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Peasant</h1>
      <div class="muted small" data-t="subtitle"></div>
    </div>
    <div class="lang"><button data-lang="de">DE</button> <button data-lang="en">EN</button></div>
  </header>

  <div id="loading" class="card muted" data-t="loading"></div>

  <!-- Setup wizard -->
  <section id="setup" class="hidden">
    <div class="card">
      <h2 data-t="welcomeTitle"></h2>
      <p data-t="welcomeText"></p>
    </div>

    <div class="card">
      <h2 data-t="redeemTitle"></h2>
      <p data-t="redeemText"></p>
      <label class="field" for="redeemCode" data-t="inviteCode"></label>
      <input type="text" id="redeemCode" autocomplete="off" spellcheck="false">
      <label class="field" for="redeemPassword" data-t="invitePassword"></label>
      <div class="row" style="margin-top:4px">
        <input type="password" id="redeemPassword" autocomplete="off" spellcheck="false">
        <button class="primary" id="redeemBtn" data-t="redeem"></button>
      </div>
      <div id="redeemStatus" class="status hidden"></div>
      <p class="muted small" data-t="redeemOwnBot"></p>
    </div>

    <div class="card step">
      <div class="num" id="n1">1</div>
      <div>
        <h2 data-t="s1Title"></h2>
        <ol>
          <li data-t="s1a"></li>
          <li data-t="s1b"></li>
          <li data-t="s1c"></li>
          <li data-t="s1d"></li>
        </ol>
        <a class="btn" id="portalLink" target="_blank" rel="noopener" href="https://discord.com/developers/applications" data-t="openPortal"></a>
      </div>
    </div>

    <div class="card step">
      <div class="num" id="n2">2</div>
      <div>
        <h2 data-t="s2Title"></h2>
        <p data-t="s2Text"></p>
        <div class="row">
          <input type="password" id="tokenInput" autocomplete="off" spellcheck="false">
          <button class="primary" id="saveToken" data-t="saveToken"></button>
        </div>
        <div id="tokenStatus" class="status hidden"></div>
        <p class="muted small" id="storageInfo"></p>
      </div>
    </div>
  </section>

  <!-- Configured -->
  <section id="ready" class="hidden">
    <div class="card step">
      <div class="num done">&#10003;</div>
      <div>
        <h2 data-t="botTitle"></h2>
        <div id="botInfo"></div>
        <div id="intentStatus" class="status hidden"></div>
      </div>
    </div>

    <div class="card step" id="inviteCard">
      <div class="num" id="n3">3</div>
      <div>
        <h2 data-t="s3Title"></h2>
        <p data-t="s3Text"></p>
        <div class="row">
          <a class="btn primary" id="inviteLink" target="_blank" rel="noopener" data-t="invite"></a>
          <button id="reloadGuilds" data-t="reloadGuilds"></button>
        </div>
        <div id="guildStatus" class="status hidden"></div>
      </div>
    </div>

    <div class="card step" id="exportCard">
      <div class="num" id="n4">4</div>
      <div>
        <h2 data-t="s4Title"></h2>
        <div class="row">
          <select id="guildSelect"></select>
        </div>
        <div class="row">
          <label><input type="checkbox" id="includeBots"> <span data-t="includeBots"></span></label>
        </div>
        <div class="row">
          <button class="primary big" id="exportBtn" data-t="export"></button>
        </div>
        <div id="exportStatus" class="status hidden"></div>
        <div id="exportResult" class="hidden">
          <p class="small muted" data-t="manualCopy"></p>
          <textarea id="exportText" readonly autocomplete="off" spellcheck="false"></textarea>
          <div class="row"><button id="copyAgain" data-t="copyAgain"></button></div>
          <p class="small muted" data-t="notStored"></p>
        </div>
      </div>
    </div>

    <div class="card step">
      <div class="num">5</div>
      <div>
        <h2 data-t="s5Title"></h2>
        <p data-t="s5Text"></p>
      </div>
    </div>

    <div class="card" id="officersCard">
      <h2 data-t="officersTitle"></h2>
      <p data-t="officersText"></p>
      <div class="mode">
        <label><input type="radio" name="pwMode" value="auto" checked> <span data-t="pwAuto"></span></label>
        <label><input type="radio" name="pwMode" value="manual"> <span data-t="pwManual"></span></label>
      </div>
      <div id="manualPw" class="hidden">
        <label class="field" for="ownPassword" data-t="pwOwn"></label>
        <div class="row" style="margin-top:4px">
          <input type="password" id="ownPassword" autocomplete="new-password" spellcheck="false">
          <label><input type="checkbox" id="showPw"> <span data-t="pwShow"></span></label>
        </div>
        <div class="meter"><div id="pwMeter"></div></div>
        <div class="small" id="pwRating"></div>
      </div>
      <div class="row">
        <button class="primary" id="createInvite" data-t="createInvite"></button>
      </div>
      <div id="inviteStatus" class="status hidden"></div>
      <div id="inviteResult" class="hidden">
        <label class="field" data-t="inviteCode"></label>
        <textarea id="inviteCodeOut" readonly spellcheck="false" style="height:70px"></textarea>
        <div class="row" style="margin-top:4px"><button id="copyCode" data-t="copyCode"></button></div>
        <label class="field" data-t="invitePassword"></label>
        <div class="row" style="margin-top:4px"><span class="secret" id="invitePwOut"></span> <button id="copyPw" data-t="copyPw"></button></div>
        <p class="small" data-t="inviteSeparate"></p>
        <p class="small muted" data-t="inviteNotStored"></p>
      </div>
      <p class="small muted" data-t="inviteRevoke"></p>
    </div>
  </section>

  <div class="card">
    <h2 data-t="privacyTitle"></h2>
    <p data-t="privacyText"></p>
    <p data-t="privacyDuty"></p>
    <a class="btn" target="_blank" rel="noopener" href="https://github.com/Flotomat/TheGuildRegistrar/blob/main/docs/privacy.md" data-t="privacyLink"></a>
    <p class="small muted" data-t="legal"></p>
  </div>

  <footer>
    <div class="muted small">Peasant {{VERSION}} &middot; The Guild Registrar &middot; GPL-3.0 &middot; <span data-t="privacy"></span></div>
    <div class="row" style="margin:0">
      <button id="removeToken" class="hidden" data-t="removeToken"></button>
      <button id="quitBtn" data-t="quit"></button>
    </div>
  </footer>
</main>

    pwAuto: "Starkes Passwort erzeugen (empfohlen)",

    pwOwn: "Dein Passwort",
    pwShow: "Anzeigen",
    createInvite: "Einladungscode erzeugen",
    creating: "Verschlüssele...",
    inviteCreated: "Einladungscode erzeugt.",
    weakConfirm: "Dieses Passwort ist schwach - wer den Code bekommt, könnte es erraten und deinen Bot nutzen. Code trotzdem erzeugen?",
    copyCode: "Code kopieren",
    copyPw: "Passwort kopieren",
    copied: "Kopiert.",
    inviteSeparate: "Gib Code und Passwort auf verschiedenen Wegen weiter, z. B. den Code als Discord-Direktnachricht und das Passwort im Sprachchat oder per Flüstern im Spiel. Poste sie nie in einem Kanal.",

    lvl_weak: "Schwach",
    lvl_medium: "Mittel",
    lvl_strong: "Stark",
    hintsPrefix: "Besser: ",
    hint_length: "mindestens 12 Zeichen",
    hint_lower: "Kleinbuchstaben",
    hint_upper: "Großbuchstaben",
    hint_digit: "Ziffern",
    hint_special: "Sonderzeichen oder Leerzeichen",
    hint_variety: "weniger wiederholte oder aufeinanderfolgende Zeichen",
    fromInviteInfo: "Verbunden über einen Einladungscode deines Gildenmeisters.",
    tokenSavedBadInvite: "Das Token aus deinem Einladungscode ist nicht mehr gültig - vermutlich hat der Gildenmeister es zurückgesetzt. Bitte ihn um einen neuen Einladungscode.",
    intentMissingInvite: "Server Members Intent ist für diesen Bot AUS. Bitte deinen Gildenmeister, ihn im Developer Portal einzuschalten.",
  },
};

let lang = localStorage.getItem("tgr-lang") || ((navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en");
let state = null;
const $ = (id) => document.getElementById(id);
const t = (k, vars) => {
  let s = (T[lang] && T[lang][k]) || T.en[k] || k;
  for (const [a, b] of Object.entries(vars || {})) s = s.replaceAll("{" + a + "}", b);
  return s;
};

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("active", b.dataset.lang === lang));
  if (state) render();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.lang; localStorage.setItem("tgr-lang", lang); applyLang();
}));

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "X-TGR-Key": KEY, "Content-Type": "application/json", ...(opts.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.message || res.statusText); e.code = data.error; throw e; }
  return data;
}

function show(el, kind, text) {
  el.className = "status " + kind;
  el.textContent = text;
}
function errText(e) { return T.en[e.code] ? t(e.code) : t("error") + e.message; }

async function load() {
  $("loading").classList.remove("hidden");
  try { state = await api("/api/state"); } catch (e) { $("loading").textContent = t("error") + e.message; return; }
  $("loading").classList.add("hidden");
  render();
}

function render() {
  const configured = state.hasToken && !state.tokenError;
  $("setup").classList.toggle("hidden", configured);
  $("ready").classList.toggle("hidden", !configured);
  $("removeToken").classList.toggle("hidden", !state.hasToken);
  $("storageInfo").textContent = t("storage") + state.tokenStorage;
  if (state.tokenError) {
    const msg = state.fromInvite ? t("tokenSavedBadInvite") : t("tokenSavedBad");
    show($("tokenStatus"), "err", msg);
    if (state.fromInvite) show($("redeemStatus"), "err", msg);
  }
  if (!configured) return;

  $("botInfo").textContent = t("botName") + state.botName + (state.fromInvite ? " - " + t("fromInviteInfo") : "");
  $("inviteCard").classList.toggle("hidden", state.fromInvite && state.guilds.length > 0);
  $("officersCard").classList.toggle("hidden", !!state.fromInvite);
  const intent = $("intentStatus");
  if (state.membersIntent) { show(intent, "ok", t("intentOk")); }
  else if (state.fromInvite) { show(intent, "warn", t("intentMissingInvite")); }
  else {
    show(intent, "warn", t("intentMissing") + " ");
    const a = document.createElement("a"); a.href = state.portalUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("openBotPage");
    intent.appendChild(a);
  }
  $("inviteLink").href = state.inviteUrl || "#";
  const gs = $("guildStatus");
  if (state.guilds.length === 0) show(gs, "warn", t("noGuilds")); else show(gs, "ok", t("guildsFound", { n: state.guilds.length }));
  $("n3").classList.toggle("done", state.guilds.length > 0);

  const sel = $("guildSelect");
  sel.innerHTML = "";
  for (const g of state.guilds) {
    const o = document.createElement("option"); o.value = g.id; o.textContent = g.name;
    if (g.id === state.guildId) o.selected = true;
    sel.appendChild(o);
  }
  $("exportCard").classList.toggle("hidden", state.guilds.length === 0);
  $("includeBots").checked = !!state.includeBots;
}

$("saveToken").addEventListener("click", async () => {
  const st = $("tokenStatus");
  show(st, "warn", t("checking"));
  try {
    await api("/api/token", { method: "POST", body: JSON.stringify({ token: $("tokenInput").value }) });
    $("tokenInput").value = "";
    clearInvite();
    show(st, "ok", t("tokenOk"));
    await load();
  } catch (e) { show(st, "err", errText(e)); }
});

$("reloadGuilds").addEventListener("click", load);

async function copy(text, fallback) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const el = fallback || $("exportText");
    if (el.select) { el.focus(); el.select(); }
    else { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { return document.execCommand("copy"); } catch (_) { return false; }
  }
}

// --- invite codes: redeem (officer) ---
$("redeemBtn").addEventListener("click", async () => {
  const st = $("redeemStatus");
  const btn = $("redeemBtn");
  btn.disabled = true;
  show(st, "warn", t("checking"));
  try {
    await api("/api/invite/redeem", { method: "POST", body: JSON.stringify({ code: $("redeemCode").value, password: $("redeemPassword").value }) });
    $("redeemCode").value = ""; $("redeemPassword").value = "";
    show(st, "ok", t("redeemOk"));
    await load();
  } catch (e) { show(st, "err", errText(e)); }
  btn.disabled = false;
});

// --- invite codes: create (guild master) ---
// an old code would contain the previous token: hide it whenever the token changes
function clearInvite() {
  $("inviteCodeOut").value = ""; $("invitePwOut").textContent = "";
  $("inviteResult").classList.add("hidden"); $("inviteStatus").classList.add("hidden");
}
const pwMode = () => document.querySelector("input[name=pwMode]:checked").value;
let lastRating = null;
let rateTimer = null;
function renderRating(r) {
  lastRating = r;
  const pw = $("ownPassword").value;
  $("pwMeter").className = pw ? r.level : "";
  if (!pw) { $("pwRating").textContent = ""; return; }
  const el = $("pwRating");
  el.textContent = "";
  const lvl = document.createElement("strong"); lvl.className = "lvl-" + r.level; lvl.textContent = t("lvl_" + r.level);
  el.appendChild(lvl);
  if (r.level !== "strong" && r.hints.length) el.appendChild(document.createTextNode(" - " + t("hintsPrefix") + r.hints.map((h) => t("hint_" + h)).join(", ")));
}
async function rate() {
  const pw = $("ownPassword").value;
  try { renderRating(await api("/api/invite/rate", { method: "POST", body: JSON.stringify({ password: pw }) })); } catch (_) {}
}
document.querySelectorAll("input[name=pwMode]").forEach((r) => r.addEventListener("change", () => {
  $("manualPw").classList.toggle("hidden", pwMode() !== "manual");
  if (pwMode() === "manual") $("ownPassword").focus();
}));
$("ownPassword").addEventListener("input", () => { clearTimeout(rateTimer); rateTimer = setTimeout(rate, 150); });
$("showPw").addEventListener("change", () => { $("ownPassword").type = $("showPw").checked ? "text" : "password"; });

$("createInvite").addEventListener("click", async () => {
  const st = $("inviteStatus");
  const btn = $("createInvite");
  let password = "";
  if (pwMode() === "manual") {
    password = $("ownPassword").value.trim();
    if (!password) { show(st, "err", t("empty_password")); return; }
    await rate();
    if (lastRating && lastRating.level === "weak" && !confirm(t("weakConfirm"))) return;
  }
  btn.disabled = true;
  show(st, "warn", t("creating"));
  try {
    const res = await api("/api/invite", { method: "POST", body: JSON.stringify({ password }) });
    $("inviteCodeOut").value = res.code;
    $("invitePwOut").textContent = res.password;
    $("inviteResult").classList.remove("hidden");
    show(st, "ok", t("inviteCreated"));
  } catch (e) { show(st, "err", errText(e)); }
  btn.disabled = false;
});
$("copyCode").addEventListener("click", async () => { if (await copy($("inviteCodeOut").value, $("inviteCodeOut"))) show($("inviteStatus"), "ok", t("copied")); });
$("copyPw").addEventListener("click", async () => { if (await copy($("invitePwOut").textContent, $("invitePwOut"))) show($("inviteStatus"), "ok", t("copied")); });

$("exportBtn").addEventListener("click", async () => {
  const st = $("exportStatus");
  const btn = $("exportBtn");
  btn.disabled = true;
  show(st, "warn", t("exporting"));
  try {
    const res = await api("/api/export", { method: "POST", body: JSON.stringify({ guildId: $("guildSelect").value, includeBots: $("includeBots").checked }) });
    $("exportText").value = res.text;
    $("exportResult").classList.remove("hidden");
    const ok = await copy(res.text);
    const vars = { m: res.members, r: res.roles, s: res.server };
    show(st, ok ? "ok" : "warn", t(ok ? "exported" : "exportedNoClip", vars));
    st.style.whiteSpace = "pre-line";
    $("n4").classList.add("done");
  } catch (e) { show(st, "err", errText(e)); }
  btn.disabled = false;
});

$("copyAgain").addEventListener("click", () => copy($("exportText").value));

$("removeToken").addEventListener("click", async () => {
  if (!confirm(t("confirmRemove"))) return;
  await api("/api/token", { method: "DELETE" });
  clearInvite();
  await load();
});

$("quitBtn").addEventListener("click", async () => {
  try { await api("/api/quit", { method: "POST" }); } catch (_) {}
  document.querySelector("main").innerHTML = "<div class='card'>" + t("bye") + "</div>";
});

setInterval(() => { api("/api/ping").catch(() => {}); }, 60000);
applyLang();
load();
</script>
</body>
</html>
